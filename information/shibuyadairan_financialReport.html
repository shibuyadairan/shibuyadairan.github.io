<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>収支報告｜渋谷大乱</title>
<meta name="description" content="渋谷大乱の大会収支報告一覧">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter+Tight:wght@500;600;700&family=Space+Grotesk:wght@400;500&family=DotGothic16&display=swap" rel="stylesheet">
<script src="../function.js"></script>
<style>
:root{
  color-scheme:light;
  --accent:#6744ff;--accent-strong:#5a3ae6;--accent-tint:#ebe6ff;--on-accent:#fff;
  --bg:#eee;--surface:#fff;--ink:#1e1e1e;--muted:#6b6b6b;
  --line:#dadada;--surface-2:#f6f6f7;--btn-bd:#b2b2b2;--btn-top:#fff;--btn-btm:#e9e9ec;--btn-ink:#333;
  --f-body:"Noto Sans JP",system-ui,sans-serif;--f-num:"Inter Tight","Noto Sans JP",system-ui,sans-serif;--f-label:"Space Grotesk","Noto Sans JP",system-ui,sans-serif;--font-body:var(--f-body);--font-num:var(--f-num);--font-label:var(--f-label);--font-dot:"DotGothic16","Noto Sans JP",system-ui,sans-serif;--foot-bg:var(--accent);--foot-ink:#fff;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --accent:#00ffc3;--accent-strong:#00ffc3;--accent-tint:#0b2a22;--on-accent:#0b0b0b;
  --bg:#0c0c0c;--surface:#151515;--ink:#e6e6e6;--muted:#9a9a9a;--foot-bg:#050505;--foot-ink:var(--accent);
  --line:#2a2a2a;--surface-2:#1b1b1b;--btn-bd:#3d3d3d;--btn-top:#262626;--btn-btm:#1a1a1a;--btn-ink:#e6e6e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;overflow-x:hidden;font-feature-settings:"palt" 1}
a{color:inherit}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px;max-width:860px;margin:0 auto;padding:0 16px}
.home{display:flex;align-items:center;gap:9px;text-decoration:none}
.home .mark{display:block;width:34px;height:34px;border:1px solid rgba(255,255,255,.08);border-radius:7px;background:#000 url("../image/home/shibuyadairan_mark.webp") center/cover no-repeat;flex:none}
.home b{font-family:var(--font-dot);font-size:20px;font-weight:400;letter-spacing:.06em;color:var(--accent-strong)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1.5px solid var(--accent);border-radius:99px;background:transparent;color:var(--accent-strong);font:500 11px/1 var(--font-label);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.tb-icon{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 0 50%,transparent 50%)}
.wrap{max-width:860px;min-height:calc(100vh - 120px);margin:0 auto;padding:0 16px}
.head{padding:26px 0 8px}
.crumb{font-size:12.5px;margin:0 0 14px}
.crumb a{color:var(--accent-strong);text-decoration:none;font-weight:500}
.crumb a::before{content:"";display:inline-block;width:6px;height:6px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:0 7px 1px 2px}
.lbl{font-family:var(--font-label);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.head h1{width:fit-content;max-width:100%;margin:6px 0 0;font-family:var(--font-dot);font-weight:400;font-size:clamp(34px,10vw,48px);line-height:1.2;color:var(--accent);letter-spacing:.06em}
.head h1::after{content:"";display:block;width:100%;height:4px;background:var(--accent);margin-top:14px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
col.date-col{width:100px}
col.tournament-col{width:64%}
col.note-col{width:auto}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
th:last-child,td:last-child{border-right:0}
thead th{font-family:var(--font-label);font-weight:500;font-size:12px;letter-spacing:.08em;color:var(--accent-strong);background:var(--accent-tint);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody td:first-child{white-space:nowrap;font-family:var(--font-num)}
tbody td{font-size:14px}
tbody a{color:var(--accent-strong);font-weight:700;text-underline-offset:3px}
.back{display:flex;justify-content:center;margin:22px 0 10px}
.back a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border:1px solid var(--btn-bd);border-radius:4px;background:linear-gradient(var(--btn-top),var(--btn-btm));color:var(--btn-ink);font-size:14px;font-weight:700;text-decoration:none}
.foot{background:var(--foot-bg);color:var(--foot-ink);padding:24px 16px 30px;text-align:center;font-family:var(--f-body);font-size:12px;margin-top:24px}
.foot p{margin:4px 0;opacity:.85}
.foot p:last-child{font-family:var(--f-label);letter-spacing:.1em;font-size:11px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:359px){.theme-btn{padding:0 10px}}
@media(max-width:480px){
  table{table-layout:fixed}
  col.date-col{width:30%}
  col.tournament-col{width:48%}
  col.note-col{width:22%}
  th,td{padding:8px 6px}
  thead th{font-size:11px;letter-spacing:0}
  tbody td{font-size:clamp(12px,3.5vw,14px);overflow-wrap:anywhere}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="home" href="../index.html" aria-label="渋谷大乱 ホームへ"><span class="mark" aria-hidden="true"></span><b>渋谷大乱</b></a>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="ライト／ダークを切り替える"><span class="tb-icon" aria-hidden="true"></span><span class="tb-txt"></span></button>
  </div>
</header>
<main class="wrap">
  <div class="head">
    <p class="crumb"><a href="../index.html#related">戻る</a></p>
    <span class="lbl">Financial Report</span>
    <h1>収支報告</h1>
    <p>大会ごとの収支報告をご確認いただけます。</p>
  </div>
  <div class="tbl">
    <table>
      <colgroup><col class="date-col"><col class="tournament-col"><col class="note-col"></colgroup>
      <thead><tr><th scope="col">日付</th><th scope="col">大会名</th><th scope="col">備考</th></tr></thead>
      <tbody id="financialReportList"></tbody>
    </table>
  </div>
  <div class="back"><a href="../index.html#related">戻る</a></div>
</main>
<footer class="foot">
  <p>この大会は、任天堂の協賛・提携を受けたものではありません。</p>
  <p>© 2026 渋谷大乱</p>
</footer>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('themeBtn');
  function current(){var theme=root.getAttribute('data-theme');if(theme)return theme;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  function paint(){var theme=current();btn.querySelector('.tb-txt').textContent=theme==='dark'?'Light':'Dark';btn.setAttribute('aria-pressed',theme==='dark'?'true':'false');}
  btn.addEventListener('click',function(){var theme=current()==='dark'?'light':'dark';root.setAttribute('data-theme',theme);try{localStorage.setItem('theme',theme);}catch(error){}paint();});
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint);}catch(error){}
  paint();

  // --------------------------------------------編集エリア--------------------------------------------
  var financialReports = [
    {
      date: '2026-08-22',
      tournament: '渋谷大乱 第一陣/SHIBUYA DAIRAN -First Strike-',
      link: '../news/shibuyadairan_01_news_01_strike.html',
      note: ''
    }
  ];
  // --------------------------------------------編集エリア--------------------------------------------

  function formatDate(value){
    var match=/^(\d{4})[./-](\d{1,2})[./-](\d{1,2})$/.exec(value);
    if(!match) throw new Error('収支報告の日付形式エラー: '+value);
    var year=Number(match[1]),month=Number(match[2]),day=Number(match[3]);
    var parsed=new Date(Date.UTC(year,month-1,day));
    if(parsed.getUTCFullYear()!==year||parsed.getUTCMonth()!==month-1||parsed.getUTCDate()!==day){
      throw new Error('収支報告日付存在エラー: '+value);
    }
    return match[1]+'.'+match[2].padStart(2,'0')+'.'+match[3].padStart(2,'0');
  }

  var list=document.getElementById('financialReportList');
  financialReports.forEach(function(report){
    var row=document.createElement('tr');
    var date=document.createElement('td');
    date.textContent=formatDate(report.date);
    var tournamentCell=document.createElement('td');
    var tournamentLink=document.createElement('a');
    tournamentLink.href=report.link;
    tournamentLink.textContent=report.tournament;
    tournamentCell.appendChild(tournamentLink);
    var note=document.createElement('td');
    note.textContent=report.note;
    row.appendChild(date);
    row.appendChild(tournamentCell);
    row.appendChild(note);
    list.appendChild(row);
  });
})();
</script>
</body>
</html>
