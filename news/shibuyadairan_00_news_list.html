    link.href=article.link;
    var meta=document.createElement('div');
    meta.className='meta';
    var publishedRow=document.createElement('div');
    var publishedTime=document.createElement('time');
    var publishedParts=article.publishedDate.split('-');
    publishedTime.dateTime=article.publishedDate;
    publishedTime.textContent=publishedParts[0]+'.'+publishedParts[1]+'.'+publishedParts[2];
    publishedRow.appendChild(publishedTime);
    var eventRow=document.createElement('div');
    eventRow.className='meta-event';
    var tag=document.createElement('span');
    tag.className='tag';
    var eventTime=document.createElement('time');
    var eventParts=article.eventDate.split('-');
    var eventDate=Date.UTC(+eventParts[0],+eventParts[1]-1,+eventParts[2]);
    var done=eventDate<today;
    var eventDay=new Date(eventDate);
    eventTime.dateTime=article.eventDate;
    eventTime.textContent=eventParts[0]+'.'+eventParts[1]+'.'+eventParts[2]+'（'+weekdays[eventDay.getUTCDay()]+'）開催';
    tag.textContent=done?'開催終了':'開催予定';
    tag.className='tag '+(done?'done':'open');
    item.classList.toggle('is-done',done);
    eventRow.appendChild(tag);
    eventRow.appendChild(eventTime);
    meta.appendChild(publishedRow);
    meta.appendChild(eventRow);
    var title=document.createElement('h2');
    title.textContent=article.title;
    link.appendChild(meta);
    link.appendChild(title);
    item.appendChild(link);
    newsList.appendChild(item);
  });
})();
</script>
</body>
</html>
