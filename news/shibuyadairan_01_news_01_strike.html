<style>
/* =====================================================================
   配色・書体：渋谷大乱 告知ポスターに準拠
   ライト = 2枚目（明るいグレー地 × バイオレット #6744FF）
   ダーク = 1枚目（黒地 × ミント #00FFC3）
   ===================================================================== */
:root{
  /* 書体 */
  --f-num:"Inter Tight","Noto Sans JP",system-ui,sans-serif;      /* 日付・数字・大見出し */
  --f-label:"Space Grotesk","Noto Sans JP",system-ui,sans-serif;  /* 字間を広げた英字ラベル */
  --f-dot:"DotGothic16","Noto Sans JP",system-ui,sans-serif;      /* ロゴ・キャッチ（ドット書体） */
  --f-body:"Noto Sans JP",system-ui,sans-serif;

  /* ライト（ポスター2枚目） */
  --accent:#6744ff; --accent-strong:#5a3ae6; --on-accent:#ffffff;
  --accent-tint:#ebe6ff; --accent-line:#c9bcff;
  --bg:#eeeeee; --surface:#ffffff; --surface-2:#f6f6f7; --panel:#e4e4e7;
  --ink:#1e1e1e; --muted:#6b6b6b; --line:#dadada; --split:#d2d2d6; --card-line:#dcdcdf;
  --link:var(--accent-strong); --done:#8a8a8a; --radius:6px;
  --btn-bd:#b2b2b2; --btn-top:#ffffff; --btn-btm:#e9e9ec; --btn-ink:#333333;
  --pri-bd:#5a3ae6; --pri-top:#7d61ff; --pri-btm:#6744ff; --pri-ink:#ffffff;
  --tab-bd:#cdcdcd; --tab-top:#ffffff; --tab-btm:#dcdcdf;
  --hero-l:#e6e6e8; --hero-r:#efeff0; --blob:rgba(0,0,0,.10);
  --cat-bg:#ffffff; --cat-edge:rgba(0,0,0,.16);
  --foot-bg:var(--accent); --foot-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#00ffc3; --accent-strong:#00ffc3; --on-accent:#0b0b0b;
    --accent-tint:#0b2a22; --accent-line:#0f5a48;
    --bg:#0c0c0c; --surface:#151515; --surface-2:#1b1b1b; --panel:#111111;
    --ink:#e6e6e6; --muted:#9a9a9a; --line:#2a2a2a; --split:#2c2c2c; --card-line:#262626;
    --done:#7a7a7a;
    --btn-bd:#3d3d3d; --btn-top:#262626; --btn-btm:#1a1a1a; --btn-ink:#e6e6e6;
    --pri-bd:#00d9a6; --pri-top:#5cffd9; --pri-btm:#00ffc3; --pri-ink:#0b0b0b;
    --tab-bd:#333333; --tab-top:#222222; --tab-btm:#161616;
    --hero-l:#121212; --hero-r:#191919; --blob:rgba(255,255,255,.07);
    --cat-bg:#161616; --cat-edge:#000000;
    --foot-bg:#050505; --foot-ink:var(--accent);
  }
}
:root[data-theme="dark"]{
  --accent:#00ffc3; --accent-strong:#00ffc3; --on-accent:#0b0b0b;
  --accent-tint:#0b2a22; --accent-line:#0f5a48;
  --bg:#0c0c0c; --surface:#151515; --surface-2:#1b1b1b; --panel:#111111;
  --ink:#e6e6e6; --muted:#9a9a9a; --line:#2a2a2a; --split:#2c2c2c; --card-line:#262626;
  --done:#7a7a7a;
  --btn-bd:#3d3d3d; --btn-top:#262626; --btn-btm:#1a1a1a; --btn-ink:#e6e6e6;
  --pri-bd:#00d9a6; --pri-top:#5cffd9; --pri-btm:#00ffc3; --pri-ink:#0b0b0b;
  --tab-bd:#333333; --tab-top:#222222; --tab-btm:#161616;
  --hero-l:#121212; --hero-r:#191919; --blob:rgba(255,255,255,.07);
  --cat-bg:#161616; --cat-edge:#000000;
  --foot-bg:#050505; --foot-ink:var(--accent);
}


*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;overflow-x:hidden;font-feature-settings:"palt" 1}
a{color:inherit}
::selection{background:var(--accent);color:var(--on-accent)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.lbl{font-family:var(--f-label);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

/* ヘッダー */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.home{display:flex;align-items:center;gap:9px;text-decoration:none}

.home b{font-family:var(--f-dot);font-weight:400;font-size:20px;color:var(--accent);letter-spacing:.06em}
.theme-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1.5px solid var(--accent);background:transparent;color:var(--accent-strong);font:500 11px/1 var(--f-label);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.tb-icon{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 0 50%,transparent 50%)}
@media (max-width:359px){.tb-txt{display:none}.theme-btn{padding:0 10px}}

/* タイトル */
.head{padding:26px 0 8px}
.crumb{font-size:12.5px;margin:0 0 14px}
.crumb a{color:var(--link);text-decoration:none;font-weight:500}
.crumb a::before{content:"";display:inline-block;width:6px;height:6px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:0 7px 1px 2px}
.head h1{width:fit-content;max-width:100%;margin:6px 0 0;font-family:var(--f-dot);font-weight:400;font-size:clamp(34px,10vw,48px);line-height:1.2;color:var(--accent);letter-spacing:.06em}
.head h1::after{content:"";display:block;width:100%;height:4px;background:var(--accent);margin-top:14px}
.head p{margin:14px 0 0;color:var(--muted);font-size:13.5px}

/* 目次 */
.toc{margin:18px 0 6px;background:var(--surface);border:1px solid var(--card-line);border-radius:var(--radius);padding:14px 16px}
.toc b{display:block;font-size:13px;margin-bottom:8px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.toc a{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:14px;text-decoration:none;color:var(--ink);border-bottom:1px dotted var(--line)}
.toc li:last-child a{border-bottom:0}
.toc a::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);flex:none}
.toc a span{font-family:var(--f-num);font-weight:700;color:var(--accent-strong);font-size:12.5px;min-width:22px}

/* セクション */
.blk{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--radius);padding:18px 16px;margin:14px 0;scroll-margin-top:68px}
.blk-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.blk-h .no{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--on-accent);background:var(--accent);border-radius:3px;padding:1px 6px;line-height:1.6}
.blk-h h2{margin:0;font-size:17px;font-weight:700;line-height:1.4}
.blk-h h2{display:flex;align-items:center;gap:8px}
.blk-h h2::before{content:"";width:4px;height:1em;background:var(--accent);flex:none}
.blk h3{margin:18px 0 8px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.blk h3::before{content:"";width:4px;height:14px;background:var(--accent);flex:none}
.blk h3:first-of-type{margin-top:4px}
.blk p{margin:8px 0}
.map-embed{margin:10px 0}
.map-embed iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:6px}

/* 表 */
.tbl{overflow-x:auto;margin:6px 0 10px;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{font-family:var(--f-label);font-weight:500;font-size:11.5px;letter-spacing:.12em;color:var(--accent-strong);background:var(--accent-tint);white-space:nowrap}
tbody th{font-weight:700;width:42%;background:var(--surface-2)}
td{font-weight:500}

/* 箇条書き・手順 */
.dots{margin:8px 0;padding:0;list-style:none}
.dots li{position:relative;padding-left:18px;margin:4px 0}
.dots li::before{content:"";position:absolute;left:4px;top:.72em;width:6px;height:6px;background:var(--accent);border-radius:1px}
.steps{list-style:none;margin:8px 0;padding:0;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:10px 0 10px 40px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent-strong);font-family:var(--f-num);font-weight:700;font-size:13px;display:grid;place-items:center}
.steps b{display:block;font-size:14.5px;line-height:1.55}
.steps p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}


/* ステージ一覧：枠の横幅いっぱいに、全カード同じ幅で並べる。名前は正式名・常に1行 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stages{--nfs:12px;--vfs:10px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:4px}
.st-list{display:contents;list-style:none}
.st-b1,.st-b2{grid-column:1/-1}
.st-b2{margin-top:8px}
.blk h3.st-band{position:relative;margin:0;display:flex;align-items:center;justify-content:center;height:28px;background:var(--accent);color:var(--on-accent);border-radius:2px}
.blk h3.st-band::before{content:"";position:absolute;left:5px;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--on-accent);opacity:.9}
.blk h3.st-band::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--on-accent);opacity:.9}
.st-en{font-family:var(--f-label);font-weight:500;font-size:12.5px;letter-spacing:.45em;padding-left:.45em}
.st-card{container-type:inline-size;border:2px solid var(--accent);border-radius:3px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.st-pic{position:relative;aspect-ratio:163/284;background-size:cover;background-position:center;background-color:#111}
.st-tab{position:absolute;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:3px 5px 2px 6px;background:var(--accent);border-top-left-radius:5px}
.st-ico{display:block;width:clamp(13px,26cqi,22px);background:var(--on-accent);-webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
.st-lab{display:flex;align-items:center;padding:6px 5px;border-top:2px solid var(--accent)}
.st-name{font-size:var(--nfs);font-weight:700;line-height:1.3;color:var(--accent-strong);white-space:nowrap;letter-spacing:-.01em}
/* 縦書きモード：横書き1行では読めない大きさになる画面幅で自動的に切り替え（名前欄をなくし写真に重ねる） */
.st-vname{display:none}
.stages.st-v .st-lab{display:none}
.stages.st-v .st-pic{aspect-ratio:1/2}
.stages.st-v .st-vname{display:block;position:absolute;left:0;top:0;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;font-size:var(--vfs);font-weight:700;line-height:1;letter-spacing:.02em;padding:4px 3px 5px;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.tcu{text-combine-upright:all;-webkit-text-combine:horizontal}
@media (max-width:389px){.stages{gap:5px}}
.gal{display:grid;gap:12px}
.gal-card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.gal-photo{position:relative;aspect-ratio:3/2;overflow:hidden;background:var(--panel)}
.gal-photo-link{position:absolute;inset:0;display:block}
.gal-photo-link img{width:100%;height:100%;object-fit:cover}
.gal-photo-link:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.gal-photo-bar{position:absolute;z-index:1;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;min-height:34px;padding:5px 9px;background:rgba(0,0,0,.68);color:#fff;font-size:11px;line-height:1.3}
.gal-account{display:inline-flex;align-items:center;gap:5px;min-width:0;color:#fff}
.gal-account svg{width:14px;height:14px;flex:none;fill:currentColor}
.gal-account span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-site{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-external{display:grid;place-items:center;width:24px;height:24px;flex:none;color:#fff}
.gal-external svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gal-account:focus-visible,.gal-external:focus-visible{outline:2px solid #fff;outline-offset:2px}
.gal-photo-bar a:hover{text-decoration:underline}
/* PC・タブレット：7枚を横一列（帯は STARTER 5列分／COUNTER 2列分） */
@media (min-width:720px){
  .stages{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .st-b1{grid-column:1/6;grid-row:1}
  .st-b2{grid-column:6/8;grid-row:1;margin-top:0}
  .st-card{grid-row:2}
  .blk h3.st-band{height:30px}
  .st-b1.st-band{clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
  .st-b2.st-band{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
}
/* 注記 */
.note{font-size:13.5px;color:var(--muted);padding:10px 12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.note.warn{color:var(--ink);font-weight:500;border-color:var(--accent-line);background:var(--accent-tint);border-left:4px solid var(--accent)}
.qa{margin:12px 0;padding:12px 14px;border:1px dashed var(--accent-line);border-radius:6px}
.qa b{color:var(--accent-strong);font-size:14px}
.qa p{margin:4px 0 0;font-size:13.5px}
.ref{font-size:13.5px}
.ref a{color:var(--link);font-weight:700;text-underline-offset:3px}

/* 末尾 */
.back{display:flex;justify-content:center;margin:22px 0 10px}
.back a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:4px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--btn-bd);color:var(--btn-ink);background:linear-gradient(var(--btn-top) 0%,var(--btn-btm) 100%)}
.foot{background:var(--foot-bg);color:var(--foot-ink);padding:24px 16px 30px;text-align:center;font-size:12px;margin-top:24px}
.foot p{opacity:.85;margin:4px 0}
.foot p:last-child{font-family:var(--f-label);letter-spacing:.1em;font-size:11px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:720px){
  .blk{padding:24px 28px}
  .blk-h h2{font-size:19px}
  tbody th{width:34%}
}

/* お知らせ詳細 */
.head h1.news-title{font-family:var(--f-body);font-weight:900;font-size:clamp(21px,5.6vw,28px);line-height:1.45;color:var(--ink);letter-spacing:.01em}
.head h1.news-title::after{width:100%}
.news-meta{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.news-meta .tag{font-size:11px;font-weight:900;border-radius:3px;padding:1px 7px;line-height:1.7}
.news-meta .tag.open{background:var(--accent);color:var(--on-accent)}
.news-meta .tag.done{background:var(--surface-2);color:var(--done);border:1px solid var(--line)}
.news-meta time{font-family:var(--f-num);letter-spacing:.02em}
.summary{margin:18px 0 6px;background:var(--panel);border:1px solid var(--card-line);border-radius:var(--radius);padding:16px}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;padding:0 0 12px;border-bottom:1px solid var(--accent)}
.summary dt{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;color:var(--accent-strong);padding-top:3px}
.summary dd{margin:0;font-weight:700;font-size:14px}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cta a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:6px 10px;border-radius:4px;font-weight:700;font-size:14px;text-align:center;text-decoration:none;line-height:1.3;border:1px solid var(--btn-bd);color:var(--btn-ink);background:linear-gradient(var(--btn-top) 0%,var(--btn-btm) 100%)}
.cta a.pri{border-color:var(--pri-bd);color:var(--pri-ink);background:linear-gradient(var(--pri-top) 0%,var(--pri-btm) 100%)}
@media (max-width:479px){.cta{grid-template-columns:1fr}}
.blk p b{color:var(--ink)}
.blk h4.gal-h{margin:12px 0 4px;font-size:14px;font-weight:700;color:var(--accent-strong)}
</style>
</head>

<body id="top">
<header class="bar">
  <div class="bar-in">
    <a class="home" href="../index.html" aria-label="渋谷大乱 ホームへ"><span class="mark" aria-hidden="true"></span><b>渋谷大乱</b></a>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="ライト／ダークを切り替える"><span class="tb-icon" aria-hidden="true"></span><span class="tb-txt"></span></button>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <p class="crumb"><a href="../index.html#news">戻る</a></p>
    <span class="lbl">News</span>
    <p class="news-meta"><span class="tag" id="evTag" data-date="2026-08-22"></span><time datetime="2026-08-22"></time></p>
    <h1 class="news-title" id="infoTitle"></h1>
  </div>

  <div class="summary">
    <dl>
      <dt>DATE</dt><dd id="summaryDate"></dd>
      <dt>VENUE</dt><dd id="summaryVenue"></dd>
      <dt>GAME</dt><dd id="summaryGame"></dd>
      <dt>ENTRY</dt><dd id="summaryEntry"></dd>
    </dl>
    <div class="cta">

    </div>
    <br>大会詳細情報はstart.ggの大会ページをご確認ください。
  </div>

  <section class="blk" id="access" aria-labelledby="h-access">
    <div class="blk-h"><h2 id="h-access">会場・アクセス</h2></div>
    <p><b id="venueName"></b><br><span id="venueAddress"></span></p>
    <div class="map-embed"><iframe id="venueMap" title="会場地図" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
    <p class="ref"><a href="https://youtube.com/shorts/DqOjn95cbHU?feature=share" target="_blank" rel="noopener">オリンピックセンター入り口から国際交流棟までの道はこちら（動画）</a></p>

  <section class="blk" id="gal" aria-labelledby="h-gal">

  <div class="back"><a href="../index.html#news">戻る</a></div>
</main>

<footer class="foot">
  <p>この大会は、任天堂の協賛・提携を受けたものではありません。</p>
  <p>© 2026 渋谷大乱</p>
</footer>

<script>
(function(){
  // --------------------------------------------編集エリア--------------------------------------------
  // お知らせタイトル
  var infoTitle = '「渋谷大乱 第一陣/SHIBUYA DAIRAN -First Strike-」開催のお知らせ';
  
  // 大会概要・会場情報
  var eventInfo = {
    date: '2026-08-22',
    summaryDate: '2026年8月22日（土）',
    venueName: '国立オリンピック記念青少年総合センター 国際交流棟 レセプションホール',
    game: '大乱闘スマッシュブラザーズ SPECIAL シングルス（256人）',
    entry: '一般枠 3,000円／持参枠 1,000円／見学枠 1,000円',
    startggUrl: 'https://www.start.gg/tournament/shibuya-dairan-first-strike/details',
    venueAddress: '〒151-0052 東京都渋谷区代々木神園町3-1',
    mapUrl: 'https://www.google.com/maps?q=%E5%9B%BD%E7%AB%8B%E3%82%AA%E3%83%AA%E3%83%B3%E3%83%94%E3%83%83%E3%82%AF%E8%A8%98%E5%BF%B5%E9%9D%92%E5%B9%B4%E7%B7%8F%E5%90%88%E3%82%BB%E3%83%B3%E3%82%BF%E3%83%BC&output=embed'
  };

  // ギャラリーに表示する一覧
  var galleryItems = [
    // ギャラリーの表示内容はここを編集
    {
      image: '../image/gallery/1/DSC02897.jpg',
      alt: '',
      photoUrl: 'https://lightroom.adobe.com/shares/1db67de4c3b9476ea568b36f7a10bda3',
      contributor: 'さきょう / sakyo',
      accountUrl: 'https://x.com/sakyooooou',
      account: '@sakyooooou',
      siteName: '/ さきょう / sakyo'
    },
    {
      image: '../image/gallery/1/DSC08330.jpg',
      alt: '',
      photoUrl: 'https://lightroom.adobe.com/shares/e5742a35bca74927b3990119902a67df',
      contributor: 'Rose・ろぜ',
      accountUrl: 'https://x.com/Noguchi_Higuchi',
      account: '@Noguchi_Higuchi',
      siteName: '/ Rose・ろぜ🥀'
    }
  ];
  // --------------------------------------------編集エリア--------------------------------------------
  document.getElementById('infoTitle').textContent = infoTitle;
  document.getElementById('summaryDate').textContent = eventInfo.summaryDate;
  document.getElementById('summaryVenue').textContent = eventInfo.venueName;
  document.getElementById('summaryGame').textContent = eventInfo.game;
  document.getElementById('summaryEntry').textContent = eventInfo.entry;
  document.getElementById('startggLink').href = eventInfo.startggUrl;
  document.getElementById('venueName').textContent = eventInfo.venueName;
  document.getElementById('venueAddress').textContent = eventInfo.venueAddress;
  document.getElementById('venueMap').src = eventInfo.mapUrl;
  document.getElementById('evTag').dataset.date = eventInfo.date;
  document.querySelector('.news-meta time').dateTime = eventInfo.date;

  var galleryList = document.getElementById('galleryList');
  if(galleryItems.length === 0) document.getElementById('gal').hidden = true;
  var galleryAccountIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.6 22H2.5l7.3-8.4L1.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L7.2 3.9H5.4L17.8 20Z"/></svg>';
  var galleryExternalIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>';
  galleryItems.forEach(function(photo){
    var card = document.createElement('article');
    card.className = 'gal-card';
    var photoFrame = document.createElement('div');
    photoFrame.className = 'gal-photo';
    var photoLink = document.createElement('a');
    photoLink.className = 'gal-photo-link';
    photoLink.href = photo.photoUrl;
    photoLink.target = '_blank';
    photoLink.rel = 'noopener';
    photoLink.setAttribute('aria-label', photo.contributor + 'さんの写真掲載先を開く');
    var image = document.createElement('img');
    image.src = photo.image;
    image.alt = photo.alt;
    image.loading = 'lazy';
    image.decoding = 'async';
    photoLink.appendChild(image);
    var photoBar = document.createElement('div');
    photoBar.className = 'gal-photo-bar';
    var accountLink = document.createElement('a');
    accountLink.className = 'gal-account';
    accountLink.href = photo.accountUrl;
    accountLink.target = '_blank';
    accountLink.rel = 'noopener';
    accountLink.setAttribute('aria-label', photo.contributor + 'さんのXアカウント');
    accountLink.innerHTML = galleryAccountIcon;
    var accountName = document.createElement('span');
    accountName.textContent = photo.account;
    accountLink.appendChild(accountName);
    var siteName = document.createElement('span');
    siteName.className = 'gal-site';
    siteName.textContent = photo.siteName;
    var externalLink = document.createElement('a');
    externalLink.className = 'gal-external';
    externalLink.href = photo.photoUrl;
    externalLink.target = '_blank';
    externalLink.rel = 'noopener';
    externalLink.setAttribute('aria-label', photo.contributor + 'さんの写真掲載先を開く');
    externalLink.innerHTML = galleryExternalIcon;
    photoBar.appendChild(accountLink);
    photoBar.appendChild(siteName);
    photoBar.appendChild(externalLink);
    photoFrame.appendChild(photoLink);
    photoFrame.appendChild(photoBar);
    card.appendChild(photoFrame);
    galleryList.appendChild(card);
  });

  var root=document.documentElement, btn=document.getElementById('themeBtn');
  function cur(){ var t=root.getAttribute('data-theme'); if(t) return t; return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
  function paint(){ var c=cur(); btn.querySelector('.tb-txt').textContent=(c==='dark'?'Light':'Dark'); btn.setAttribute('aria-pressed',c==='dark'?'true':'false'); }
  btn.addEventListener('click',function(){ var n=cur()==='dark'?'light':'dark'; root.setAttribute('data-theme',n); try{localStorage.setItem('theme',n);}catch(e){} paint(); });
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint); }catch(e){}
  paint();
  // 開催予定／開催終了（日本時間で判定）
  var t=document.getElementById('evTag'), d=t.dataset.date.split('-');
  var now=new Date(Date.now()+9*3600*1000), today=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate());
  var done=Date.UTC(+d[0],+d[1]-1,+d[2])<today; t.textContent=done?'開催終了':'開催予定'; t.className='tag '+(done?'done':'open');
})();
</script>
